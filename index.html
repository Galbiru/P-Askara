    const ALL_LINKS = RAW_CONTENT.split('\n').map(l => l.trim()).filter(l => l !== "" && l.includes("http"));

    let linkIndex = 0;
    const finalData = REGIONS.map(region => {
      let regionUsers = [];
      let totalAssignedToRegion = 0;
      
      region.users.forEach(user => {
        let userLinks = [];
        for (let i = 0; i < user.quota; i++) {
          if (linkIndex < ALL_LINKS.length) {
            userLinks.push(ALL_LINKS[linkIndex]);
            linkIndex++;
            totalAssignedToRegion++;
          }
        }
        // Biar yang namanya 'null' tetap tampil rapi di UI
        let displayName = user.name.startsWith('null') ? 'null' : user.name;
        regionUsers.push({ name: displayName, links: userLinks });
      });

      return {
        id: region.id,
        name: region.name,
        totalLinks: totalAssignedToRegion,
        interviewers: regionUsers
      };
    });

    console.log("Total Links Terdistribusi:", linkIndex);

    function showView(viewId) {
      ['view-welcome', 'view-regions', 'view-interviewers', 'view-links'].forEach(id => {
        document.getElementById(id).style.display = (id === viewId) ? 'block' : 'none';
      });
      if (viewId === 'view-regions') {
        document.getElementById('input-search').value = '';
        document.getElementById('search-results-grid').style.display = 'none';
        document.getElementById('regions-grid').style.display = 'grid';
      }
    }

    function renderRegions() {
      const grid = document.getElementById('regions-grid');
      grid.innerHTML = '';
      finalData.forEach((region, rIdx) => {
        const btn = document.createElement('button');
        btn.className = 'card-item';
        btn.innerHTML = `<div class="badge-circle">${rIdx+1}</div><div><b>${region.name}</b><br><small>${region.interviewers.length} Interviewer | Total ${region.totalLinks} Link</small></div>`;
        btn.onclick = () => renderInterviewers(rIdx);
        grid.appendChild(btn);
      });
    }

    function renderInterviewers(rIdx) {
      const region = finalData[rIdx];
      document.getElementById('location-title-for-interviewer').innerText = `Wilayah: ${region.name}`;
      
      const grid = document.getElementById('interviewers-grid');
      grid.innerHTML = '';
      region.interviewers.forEach((intv, i) => {
        const btn = document.createElement('button');
        btn.className = 'card-item';
        btn.innerHTML = `<div class="badge-circle">${i+1}</div><div><b>${intv.name}</b><br><small>${intv.links.length} Link Tersedia</small></div>`;
        btn.onclick = () => renderLinks(rIdx, i);
        grid.appendChild(btn);
      });

      document.getElementById('btn-back-to-prev').onclick = () => showView('view-regions');
      showView('view-interviewers');
    }

    function renderLinks(rIdx, iIdx) {
      const region = finalData[rIdx];
      const intv = region.interviewers[iIdx];

      document.getElementById('interviewer-title').innerText = `${intv.name} (${region.name})`;
      
      const grid = document.getElementById('links-grid');
      grid.innerHTML = '';
      intv.links.forEach((link, lIdx) => {
        const btn = document.createElement('button');
        btn.className = 'card-item';
        btn.innerHTML = `<div class="badge-circle">${lIdx+1}</div><div style="font-size:0.7rem; word-break:break-all;">${link}</div>`;
        btn.onclick = () => window.open(link, '_blank');
        grid.appendChild(btn);
      });

      document.getElementById('btn-back-to-interviewers').onclick = () => renderInterviewers(rIdx);
      showView('view-links');
    }

    document.getElementById('input-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const resGrid = document.getElementById('search-results-grid');
      const regGrid = document.getElementById('regions-grid');

      if (!q) {
        resGrid.style.display = 'none';
        regGrid.style.display = 'grid';
        return;
      }

      resGrid.style.display = 'grid';
      regGrid.style.display = 'none';
      resGrid.innerHTML = '';

      let resultsCount = 0;
      finalData.forEach((region, rIdx) => {
        if (region.name.toLowerCase().includes(q)) {
          const btn = document.createElement('button');
          btn.className = 'card-item';
          btn.style.borderColor = 'var(--accent)';
          btn.innerHTML = `<div class="badge-circle">W</div><div><b>${region.name}</b><br><small>Wilayah (${region.interviewers.length} User)</small></div>`;
          btn.onclick = () => renderInterviewers(rIdx);
          resGrid.appendChild(btn);
          resultsCount++;
        }

        region.interviewers.forEach((intv, iIdx) => {
          if (intv.name.toLowerCase().includes(q)) {
            const btn = document.createElement('button');
            btn.className = 'card-item';
            btn.innerHTML = `<div class="badge-circle">I</div><div><b>${intv.name}</b><br><small>${region.name} • ${intv.links.length} Link</small></div>`;
            btn.onclick = () => renderLinks(rIdx, iIdx);
            resGrid.appendChild(btn);
            resultsCount++;
          }
        });
      });

      if (resultsCount === 0) {
        resGrid.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.85rem;">Tidak ada hasil untuk "${q}"</div>`;
      }
    });

    window.onload = () => {
      document.getElementById('total-info').innerText = `Distribusi spesifik ${linkIndex} link per wilayah dan interviewer.`;
      renderRegions();
      showView('view-welcome');
    };
  </script>
