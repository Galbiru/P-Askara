<html lang="id">
<head>

    @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap");
    
    :root { 
      --bg-main: #0B1121; 
      --bg-card: #151F32; 
      --accent: #D4AF37; 
      --accent-soft: #F9E596; 
      --accent-hover: #AA8C2C;
      --text-main: #E2E8F0; 
      --text-muted: #94A3B8; 
      --border-color: rgba(212, 175, 55, 0.2);
      --success: #10B981;
    }

    body { 
      margin: 0; 
      padding: 20px; 
      min-height: 100vh; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.08), transparent 50%), 
                  linear-gradient(135deg, var(--bg-main), #050811); 
      color: var(--text-main); 
    }

    .app-shell { 
      max-width: 540px; 
      margin: 0 auto; 
      border-radius: 20px; 
      background: rgba(21, 31, 50, 0.85); 
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color); 
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.1); 
      padding: 25px; 
      position: relative; 
    }

    .header-logo {
      font-family: 'Playfair Display', serif;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
      display: inline-block;
    }

    h1 { 
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem; 
      margin: 5px 0; 
      color: #fff;
      font-weight: 700;
    }

    .btn-primary { 
      background: linear-gradient(135deg, var(--accent), var(--accent-hover)); 
      border: none; 
      color: #000; 
      padding: 14px; 
      border-radius: 12px; 
      width: 100%; 
      cursor: pointer; 
      font-weight: 600; 
      margin-top: 15px; 
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }

    .grid-container { 
      display: grid; 
      grid-template-columns: 1fr; 
      gap: 12px; 
      margin-top: 15px; 
      max-height: 65vh;
      overflow-y: auto;
      padding-right: 5px;
    }

    .grid-container::-webkit-scrollbar { width: 6px; }
    .grid-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px;}
    .grid-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

    .card-item { 
      display: flex; 
      align-items: center; 
      gap: 15px; 
      padding: 15px; 
      border-radius: 14px; 
      border: 1px solid rgba(255,255,255,0.05); 
      background: linear-gradient(145deg, rgba(255,255,255,0.03), transparent); 
      color: #fff; 
      text-align: left; 
      cursor: pointer; 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
      width: 100%; 
      box-sizing: border-box; 
      font-family: inherit;
    }

    .card-item:hover { 
      background: rgba(212, 175, 55, 0.08); 
      border-color: var(--accent); 
      transform: translateY(-2px); 
    }

    .badge-circle { 
      min-width: 34px; 
      height: 34px; 
      border-radius: 50%; 
      background: rgba(212, 175, 55, 0.15); 
      border: 1px solid var(--accent);
      color: var(--accent-soft);
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 0.85rem; 
      font-weight: 600; 
    }

    .back-link { 
      color: var(--text-muted); 
      cursor: pointer; 
      background: none; 
      border: none; 
      margin-bottom: 10px; 
      padding: 0; 
      font-size: 0.85rem; 
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    h3 { 
      font-family: 'Playfair Display', serif;
      margin-top: 5px; 
      border-left: 3px solid var(--accent); 
      padding-left: 12px; 
      margin-bottom: 15px;
      font-weight: 500;
      color: #fff;
    }

    .search-box { 
      width: 100%; 
      padding: 14px 18px; 
      border-radius: 12px; 
      border: 1px solid rgba(255,255,255,0.1); 
      background: rgba(0,0,0,0.3); 
      color: var(--text-main); 
      font-family: inherit; 
      font-size: 0.9rem; 
      outline: none; 
      transition: 0.3s; 
      box-sizing: border-box; 
      margin-bottom: 15px; 
    }
    .search-box:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); 
    }

    /* KELAS KHUSUS LINK YANG SUDAH DIKLIK */
    .link-clicked {
      opacity: 0.4 !important;
      filter: grayscale(100%);
      background: rgba(0,0,0,0.3) !important;
      border-color: transparent !important;
      box-shadow: none !important;
      transform: none !important;
    }
    
    .link-clicked .badge-circle {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
      color: #888;
    }
    
    .status-icon {
      font-size: 1.1rem;
      margin-left: 10px;
    }
    .link-clicked .status-icon {
      color: var(--success);
    }
    
    /* Tombol Reset Tracker */
    .reset-btn {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--text-muted);
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 0.7rem;
        cursor: pointer;
        transition: 0.2s;
    }
    .reset-btn:hover {
        background: rgba(255,255,255,0.1);
        color: #fff;
    }
  </style>
</head>

    const ALL_LINKS = RAW_CONTENT.split('\n').map(l => l.trim()).filter(l => l !== "" && l.includes("http"));

    let linkIndex = 0;
    const finalData = REGIONS.map(region => {
      let regionUsers = [];
      let totalAssignedToRegion = 0;
      
      region.users.forEach(user => {
        let userLinks = [];
        for (let i = 0; i < user.quota; i++) {
          if (linkIndex < ALL_LINKS.length) {
            userLinks.push(ALL_LINKS[linkIndex]);
            linkIndex++;
            totalAssignedToRegion++;
          }
        }
        let displayName = user.name.startsWith('null') ? 'null' : user.name;
        regionUsers.push({ name: displayName, links: userLinks });
      });

      return {
        id: region.id,
        name: region.name,
        totalLinks: totalAssignedToRegion,
        interviewers: regionUsers
      };
    });

    // State Penyimpanan
    let currentRIdx = null;
    let currentIIdx = null;

    function getClickedLinks() {
      return JSON.parse(localStorage.getItem('kamarah_clicked_links_v4') || '[]');
    }

    function markAsClicked(link, elementId, rIdx, iIdx) {
      let clicked = getClickedLinks();
      if (!clicked.includes(link)) {
        clicked.push(link);
        localStorage.setItem('kamarah_clicked_links_v4', JSON.stringify(clicked));
      }
      
      const btn = document.getElementById(elementId);
      if(btn) {
        btn.classList.add('link-clicked');
        const iconDiv = btn.querySelector('.status-icon');
        if(iconDiv) iconDiv.innerText = '✔️';
      }
      
      updateProgressUI(rIdx, iIdx);
      window.open(link, '_blank');
    }
    
    function resetUserTracker() {
        if(currentRIdx === null || currentIIdx === null) return;
        
        const confirmReset = confirm("Anda yakin ingin mereset progress link user ini? Warna link akan kembali seperti semula.");
        if(!confirmReset) return;

        let clicked = getClickedLinks();
        const userLinks = finalData[currentRIdx].interviewers[currentIIdx].links;
        
        clicked = clicked.filter(link => !userLinks.includes(link));
        localStorage.setItem('kamarah_clicked_links_v4', JSON.stringify(clicked));
        
        renderLinks(currentRIdx, currentIIdx);
    }

    function updateProgressUI(rIdx, iIdx) {
      const region = finalData[rIdx];
      const intv = region.interviewers[iIdx];
      const clickedLinks = getClickedLinks();
      
      let usedCount = 0;
      intv.links.forEach(l => {
        if(clickedLinks.includes(l)) usedCount++;
      });
      
      document.getElementById('progress-info').innerText = `${usedCount} / ${intv.links.length} Terpakai`;
    }

    function showView(viewId) {
      ['view-welcome', 'view-regions', 'view-interviewers', 'view-links'].forEach(id => {
        document.getElementById(id).style.display = (id === viewId) ? 'block' : 'none';
      });
      if (viewId === 'view-regions') {
        document.getElementById('input-search').value = '';
        document.getElementById('search-results-grid').style.display = 'none';
        document.getElementById('regions-grid').style.display = 'grid';
      }
    }

    function renderRegions() {
      const grid = document.getElementById('regions-grid');
      grid.innerHTML = '';
      finalData.forEach((region, rIdx) => {
        const btn = document.createElement('button');
        btn.className = 'card-item';
        btn.innerHTML = `<div class="badge-circle">${rIdx+1}</div>
                         <div style="flex:1;"><b>${region.name}</b><br><small style="color:var(--text-muted);">${region.interviewers.length} Interviewer</small></div>
                         <div style="text-align:right; font-size:0.75rem; color:var(--accent);">${region.totalLinks} Link</div>`;
        btn.onclick = () => renderInterviewers(rIdx);
        grid.appendChild(btn);
      });
    }

    function renderInterviewers(rIdx) {
      const region = finalData[rIdx];
      document.getElementById('location-title-for-interviewer').innerText = `Wilayah: ${region.name}`;
      
      const grid = document.getElementById('interviewers-grid');
      grid.innerHTML = '';
      
      const clickedLinks = getClickedLinks();

      region.interviewers.forEach((intv, i) => {
        let usedCount = 0;
        intv.links.forEach(l => { if(clickedLinks.includes(l)) usedCount++; });
        
        const btn = document.createElement('button');
        btn.className = 'card-item';
        
        const allUsed = (usedCount === intv.links.length && intv.links.length > 0);
        if(allUsed) btn.style.borderLeft = '3px solid var(--success)';

        btn.innerHTML = `<div class="badge-circle">${i+1}</div>
                         <div style="flex:1;"><b>${intv.name}</b><br><small style="color:var(--text-muted);">Sisa: ${intv.links.length - usedCount} Link</small></div>
                         <div style="font-size:0.75rem; ${allUsed ? 'color:var(--success);' : 'color:var(--accent);'}">${usedCount}/${intv.links.length}</div>`;
        btn.onclick = () => renderLinks(rIdx, i);
        grid.appendChild(btn);
      });

      document.getElementById('btn-back-to-prev').onclick = () => showView('view-regions');
      showView('view-interviewers');
    }

    function renderLinks(rIdx, iIdx) {
      currentRIdx = rIdx;
      currentIIdx = iIdx;
      
      const region = finalData[rIdx];
      const intv = region.interviewers[iIdx];
      const clickedLinks = getClickedLinks();

      document.getElementById('interviewer-title').innerText = `${intv.name} (${region.name})`;
      updateProgressUI(rIdx, iIdx);
      
      const grid = document.getElementById('links-grid');
      grid.innerHTML = '';
      
      intv.links.forEach((link, lIdx) => {
        const isClicked = clickedLinks.includes(link);
        const btnId = `link-btn-${rIdx}-${iIdx}-${lIdx}`;
        
        const btn = document.createElement('button');
        btn.className = 'card-item ' + (isClicked ? 'link-clicked' : '');
        btn.id = btnId;
        
        const icon = isClicked ? '✔️' : '🔗';
        
        btn.innerHTML = `<div class="badge-circle" style="min-width:28px; height:28px; font-size:0.7rem;">${lIdx+1}</div>
                         <div style="font-size:0.7rem; word-break:break-all; flex:1; line-height:1.4;">${link}</div>
                         <div class="status-icon">${icon}</div>`;
                         
        btn.onclick = () => markAsClicked(link, btnId, rIdx, iIdx);
        grid.appendChild(btn);
      });

      document.getElementById('btn-back-to-interviewers').onclick = () => renderInterviewers(rIdx);
      showView('view-links');
    }

    document.getElementById('input-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const resGrid = document.getElementById('search-results-grid');
      const regGrid = document.getElementById('regions-grid');

      if (!q) {
        resGrid.style.display = 'none';
        regGrid.style.display = 'grid';
        return;
      }

      resGrid.style.display = 'grid';
      regGrid.style.display = 'none';
      resGrid.innerHTML = '';

      let resultsCount = 0;
      finalData.forEach((region, rIdx) => {
        if (region.name.toLowerCase().includes(q)) {
          const btn = document.createElement('button');
          btn.className = 'card-item';
          btn.style.borderColor = 'var(--accent)';
          btn.innerHTML = `<div class="badge-circle">W</div><div style="flex:1;"><b>${region.name}</b><br><small>Wilayah (${region.interviewers.length} User)</small></div>`;
          btn.onclick = () => renderInterviewers(rIdx);
          resGrid.appendChild(btn);
          resultsCount++;
        }

        region.interviewers.forEach((intv, iIdx) => {
          if (intv.name.toLowerCase().includes(q)) {
            const btn = document.createElement('button');
            btn.className = 'card-item';
            btn.innerHTML = `<div class="badge-circle">I</div><div style="flex:1;"><b>${intv.name}</b><br><small>${region.name}</small></div>
                             <div style="font-size:0.75rem; color:var(--accent);">${intv.links.length} Link</div>`;
            btn.onclick = () => renderLinks(rIdx, iIdx);
            resGrid.appendChild(btn);
            resultsCount++;
          }
        });
      });

      if (resultsCount === 0) {
        resGrid.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.85rem;">Tidak ada hasil untuk "${q}"</div>`;
      }
    });

    window.onload = () => {
      document.getElementById('total-info').innerText = `Total Data: ${linkIndex} Link diaktifkan untuk operasional.`;
      renderRegions();
      showView('view-welcome');
    };
  </script>
